<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Extract page info with one click · 设置</title><link rel="stylesheet" href="popup.css"><style>body{width:auto;min-height:100vh}.settings{max-width:620px;margin:auto}.setting{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.setting label{display:flex;justify-content:space-between;align-items:center}.setting p{color:var(--muted);font-size:11px;margin:7px 0 0}.select{background:#22252c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px}</style></head><body><main class="settings"><header class="hero"><div class="mark">✦</div><div><p class="eyebrow">EXTRACT PAGE INFO</p><h1>设置</h1><p>调整语言与页面解析偏好</p></div></header><section class="setting"><label><b>界面语言</b><select id="language" class="select"><option value="auto">跟随浏览器</option><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ja">日本語</option></select></label><p>语言设置会影响扩展弹窗与复制内容的标题。</p></section><section class="setting"><label><b>隐私模式</b><input id="privacyMode" type="checkbox" checked></label><p>页面内容只在浏览器本地解析，不调用外部 AI 或上传服务。</p></section><p style="color:var(--muted);font-size:11px">版本 1.3.0 · Manifest V3</p></main><script src="options.js"></script></body></html>
